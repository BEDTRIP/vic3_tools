[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vic3tools"
version = "0.1.0"
description = "Tools for Victoria 3 modding, for modders and coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pillow>=10"]
img = ["pillow>=10"]

[project.scripts]
v3 = "vic3tools.cli:main"

[tool.setuptools.packages.find]
include = ["vic3tools*"]

[tool.setuptools.package-data]
vic3tools = ["i18n/*.toml", "data/*.toml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
